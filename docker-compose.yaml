
#version: "3.8"

services:
  mysqldb:
    image: mysql:oraclelinux9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kafkaDB
    ports:
      - "3308:3306"
    networks:
      - springboot-kafka-mysql-net

#version: '3.1'

#services:
  zookeeper:
    image: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - springboot-kafka-mysql-net


  kafka:
    image: apache/kafka:4.0.1-rc1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    networks:
      - springboot-kafka-mysql-net

  springboot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mysqldb
    networks:
      - springboot-kafka-mysql-net
    restart: on-failure


networks:
  springboot-kafka-mysql-net:
